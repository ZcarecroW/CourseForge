# Builds the documentation in docs/ and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://zcarecrow.github.io/CourseForge/.
#
# The reference pages are generated from the code (tools/docs-data.php reads the
# tool registry, the settings and the prompt library), so a change there
# rebuilds the site as well as a change to the pages themselves. The build
# needs Node and PHP and nothing else. `node docs/publish.mjs` does the same
# from a laptop.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'config/defaults.json'
      - 'src/**'
      - 'tools/docs-data.php'
      - 'assets/favicon.svg'
      - 'assets/js/components/AppIcon.js'
      - 'assets/vendor/marked.esm.js'
      - 'assets/vendor/shiki/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push waits rather than cancelling one that is
# half way through.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Make sure PHP is there
        run: |
          command -v php || { sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-mbstring; }
          php --version

      - name: Build and publish
        env:
          DOCS_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: node docs/publish.mjs
