<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 268" role="img" aria-labelledby="cache-t">
  <title id="cache-t">Two page prompts side by side. Both start with the same course map, the same chapter and the same system text, so the second page reads those from the provider's cache and pays in full only for its own short brief.</title>
  <text class="t-sm t-b" x="20" y="22">cache breakpoints</text>
  <path class="line-dash" d="M126 26V200"/>
  <g class="cache"><path d="M394 30l5 5-5 5-5-5z"/><path d="M504 30l5 5-5 5-5-5z"/><path d="M634 30l5 5-5 5-5-5z"/></g>
  <path class="line-dash" d="M394 40V200M504 40V200M634 40V200" style="stroke:var(--success);opacity:.55"/>

  <text class="t-head" x="20" y="78">Page 2.1</text>
  <text class="t-sm" x="20" y="96">the first of</text>
  <text class="t-sm" x="20" y="110">its chapter</text>
  <rect class="box-accent" x="134" y="56" width="254" height="56" rx="8"/>
  <rect class="box-accent" x="398" y="56" width="100" height="56" rx="8"/>
  <rect class="box-accent" x="508" y="56" width="120" height="56" rx="8"/>
  <rect class="box-warn" x="642" y="56" width="158" height="56" rx="8"/>
  <g text-anchor="middle">
    <text class="t-b" x="261" y="80">Course map + research</text>
    <text class="t-sm" x="261" y="98">every page and its scope</text>
    <text class="t-b" x="448" y="80">Chapter 2</text>
    <text class="t-sm" x="448" y="98">its goal</text>
    <text class="t-b" x="568" y="80">System text</text>
    <text class="t-sm" x="568" y="98">rules, details</text>
    <text class="t-b" x="721" y="80">Brief for 2.1</text>
    <text class="t-sm" x="721" y="98">scope, neighbours</text>
  </g>

  <text class="t-head" x="20" y="166">Page 2.2</text>
  <text class="t-sm" x="20" y="184">and every page</text>
  <text class="t-sm" x="20" y="198">after it</text>
  <rect class="box-success" x="134" y="144" width="254" height="56" rx="8"/>
  <rect class="box-success" x="398" y="144" width="100" height="56" rx="8"/>
  <rect class="box-success" x="508" y="144" width="120" height="56" rx="8"/>
  <rect class="box-warn" x="642" y="144" width="158" height="56" rx="8"/>
  <g text-anchor="middle">
    <text class="t-b" x="261" y="168">identical bytes</text>
    <text class="t-sm" x="261" y="186">read from the cache</text>
    <text class="t-b" x="448" y="168">identical</text>
    <text class="t-sm" x="448" y="186">cache read</text>
    <text class="t-b" x="568" y="168">identical</text>
    <text class="t-sm" x="568" y="186">cache read</text>
    <text class="t-b" x="721" y="168">Brief for 2.2</text>
    <text class="t-sm" x="721" y="186">paid in full</text>
  </g>

  <g transform="translate(134 232)">
    <rect class="box-accent" width="14" height="14" rx="3"/><text class="t-sm" x="22" y="12">written to the cache once</text>
    <rect class="box-success" x="200" width="14" height="14" rx="3"/><text class="t-sm" x="222" y="12">read back at a fraction of the price</text>
    <rect class="box-warn" x="452" width="14" height="14" rx="3"/><text class="t-sm" x="474" y="12">differs for every page</text>
  </g>
</svg>
