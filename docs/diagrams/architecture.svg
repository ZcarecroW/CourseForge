  <rect class="box-success" x="680" y="30" width="120" height="70" rx="10"/>
  <rect class="box" x="680" y="124" width="120" height="70" rx="10"/>
  <rect class="box" x="680" y="218" width="120" height="70" rx="10"/>
  <g text-anchor="middle">
    <text class="t-b" x="740" y="58">SQLite</text><text class="t-sm" x="740" y="78">data/app.sqlite</text>
    <text class="t-b" x="740" y="152">AI providers</text><text class="t-sm" x="740" y="172">live and batch</text>
    <text class="t-b" x="740" y="246">BookStack</text><text class="t-sm" x="740" y="266">REST API</text>
