; CourseForge - per-directory PHP configuration
;
; PHP reads this file on the CGI, FastCGI and FPM SAPIs. It applies to this
; directory and everything below it, and it can set any directive marked
; PHP_INI_USER or PHP_INI_PERDIR. Under mod_php it is never read - there the
; same values belong in .htaccess as php_value lines, or in your hosting
; control panel.
;
; PHP caches this file (user_ini.cache_ttl, usually 300 seconds), so an edit
; can take up to five minutes to take effect.
;
; ---------------------------------------------------------------------------
;
; WHAT IS AND IS NOT IN HERE, AND WHY
;
; Only two settings ship with a value, and both are the same answer on every
; host. Everything else CourseForge wants is a NUMBER, and a number cannot be
; shipped safely: writing `memory_limit = 256M` here would raise a host that
; gives 128M and quietly HALVE one that gives 512M. A configuration file that
; makes a good host worse is not worth having.
;
; So the numbers are measured rather than shipped. Open Settings and press
; "Set up PHP", or simply open the application as an administrator - it runs
; once by itself - and CourseForge writes a managed block below with the
; limits this host actually needs raised. Anything the host is already
; generous about is left exactly as it was.
;
; The managed block is delimited by comment markers. Anything you write outside
; those markers is yours and is never touched. To have the host measured again
; from scratch - after moving to different hosting, say - delete the managed
; block and reload the application.

; An error page that prints a file path tells a stranger where the database is.
display_errors = Off

; What display_errors stops showing still has to go somewhere it can be read.
log_errors = On
